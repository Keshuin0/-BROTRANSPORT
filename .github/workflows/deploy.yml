name: CI/CD — Verify & Deploy #BRO Transport OS to Cloudflare Workers

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, Unit/Security Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Install Dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Static Typecheck (Astro Check + TypeScript)
        run: pnpm run typecheck

      - name: Run Deterministic Contract, Crypto, Customs, Billing & Security Tests
        run: pnpm run test

      - name: Build Full-Stack Cloudflare Workers Bundle
        run: pnpm run build
        env:
          NODE_ENV: production

  deploy:
    name: Deploy Dual-Portal OS to Cloudflare Workers
    needs: verify
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Production Bundle
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Apply D1 Migrations & Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping Cloudflare deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets."
            exit 0
          fi
          if grep -q "00000000-0000-0000-0000-000000000000" wrangler.jsonc; then
            echo "Skipping Cloudflare deploy: replace placeholder D1 database_id and KV id in wrangler.jsonc first."
            exit 0
          fi
          pnpm exec wrangler d1 migrations apply brotransport-db --remote
          pnpm exec wrangler deploy
